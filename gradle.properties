org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# targetSdk for the manager app only (compileSdk stays modern, see build.gradle).
# 21 = Android 5.0 legacy behaviour. Android 15+ refuses to install targetSdk < 24 unless you use
#   adb install --bypass-low-target-sdk-block <apk>
# Set this to 24 if you want normal installs/updates through the package installer.
shizuku.manager.targetSdk=37
